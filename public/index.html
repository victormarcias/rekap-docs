<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rekap — Victor Hugo Marcias</title>
  <meta name="description" content="Personal engineering knowledge base, read live from the Rekap repo.">
  <meta name="color-scheme" content="dark">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%93%9A</text></svg>">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown-dark.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <link rel="stylesheet" href="rekap.css">
  <link rel="stylesheet" href="language.css">
</head>

<body class="rekap-body">
  <header class="rekap-header">
    <a href="/" class="rekap-home-link">&larr; <span class="rekap-home-link-text">victormarcias.online</span></a>
    <h1 class="rekap-title">📚 Rekap</h1>
    <div id="rekap-lang-menu" class="rekap-lang-menu">
      <button type="button" id="rekap-lang-button" class="rekap-lang-button" aria-haspopup="listbox" aria-expanded="false">
        <span class="rekap-lang-flag" aria-hidden="true">🇬🇧</span>
        <span class="rekap-lang-code">EN</span>
        <svg class="rekap-lang-caret" viewBox="0 0 12 8" width="10" height="7" aria-hidden="true">
          <path d="M1 1l5 5 5-5" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
      <ul id="rekap-lang-list" class="rekap-lang-list" role="listbox" aria-label="Language" hidden>
        <li role="option" data-lang="es" aria-selected="false"><span class="rekap-lang-flag" aria-hidden="true">🇪🇸</span> Español</li>
        <li role="option" data-lang="en" aria-selected="true"><span class="rekap-lang-flag" aria-hidden="true">🇬🇧</span> English</li>
      </ul>
    </div>
    <span class="rekap-header-spacer"></span>
    <button id="rekap-sidebar-toggle" class="rekap-sidebar-toggle" type="button" aria-label="Toggle contents" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>
  </header>

  <div class="rekap-layout">
    <nav id="rekap-sidebar" class="rekap-sidebar" aria-label="Rekap contents">
      <input id="rekap-search" class="rekap-search" type="search" placeholder="Search files…" autocomplete="off" spellcheck="false">
      <div id="rekap-tree-container">
        <div class="rekap-status">Loading contents&hellip;</div>
      </div>
    </nav>
    <div id="rekap-sidebar-backdrop" class="rekap-sidebar-backdrop"></div>
    <main id="rekap-content" class="rekap-content">
      <div id="rekap-content-inner" class="markdown-body">
        <div class="rekap-status">Loading&hellip;</div>
      </div>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked-gfm-heading-id/3.2.0/index.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="filetree.js"></script>
  <script src="language.js"></script>
  <script src="rekap.js"></script>
</body>

</html>
